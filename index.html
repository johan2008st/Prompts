<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de información</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <aside class="menu">

        <h1>Organizador</h1>

        <form id="formulario">

            <label for="texto">Nueva información</label>

            <textarea id="texto" rows="6" placeholder="Escribe aquí tu información" required autofocus>
            </textarea>

            <button type="submit">Guardar</button>

        </form>

        <p class="total">
            Guardados: <span id="contador">0</span>
        </p>

    </aside>

    <section class="contenido" id="contenido">

        <p class="vacio">Aún no hay información guardada.</p>

    </section>

</body>

</html>
